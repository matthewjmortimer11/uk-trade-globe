<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Where Britain Sells — UK trade in goods, by market</title>
    <meta
      name="description"
      content="Every UK goods export and import, by country and month, from the ONS API. £ millions, 239 markets, 96 months."
    />
    <meta name="theme-color" content="#05080f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23123049' stroke='%23f2c14e' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app" class="shell" aria-busy="true">
      <header class="bar">
        <div class="brand">
          <h1>Where Britain Sells</h1>
          <p id="subtitle">
            UK trade in goods by market, monthly since January 2018.
            Office for National Statistics.
          </p>
        </div>

        <div class="controls">
          <div class="seg" role="radiogroup" aria-label="Trade direction">
            <button type="button" role="radio" data-dir="EX" aria-checked="true">Exports</button>
            <button type="button" role="radio" data-dir="IM" aria-checked="false">Imports</button>
            <button type="button" role="radio" data-dir="BAL" aria-checked="false">Balance</button>
          </div>

          <label class="field">
            <span>Commodity</span>
            <select id="commodity"></select>
          </label>
        </div>
      </header>

      <section class="rail" aria-label="Headline figures and top markets">
        <div class="hero">
          <p class="hero-label" id="hero-label">Total goods exports</p>
          <p class="hero-value" id="hero-value">—</p>
          <p class="hero-meta">
            <span id="hero-month">—</span>
            <span class="delta" id="hero-yoy"></span>
          </p>
        </div>

        <h2 class="caption">
          <span id="rank-title">Top markets</span>
          <b id="rank-count"></b>
        </h2>

        <ol class="ranks" id="ranks" aria-label="Markets ranked by value"></ol>
      </section>

      <section class="stage" aria-label="Globe">
        <canvas id="globe" aria-label="Interactive globe of UK trade flows. Use the market list for a text equivalent."></canvas>
        <div class="stage-hint" id="stage-hint">Drag to rotate · scroll to zoom · click a country</div>
        <div class="legend" id="legend" aria-hidden="true"></div>
      </section>

      <aside class="detail" id="detail" aria-live="polite" aria-label="Selected market"></aside>

      <footer class="scrub">
        <button type="button" id="play" class="play" aria-label="Play through every month">▶</button>
        <input
          type="range"
          id="time"
          min="0"
          max="0"
          value="0"
          step="1"
          aria-label="Month"
        />
        <output id="time-label" class="time-label">—</output>
        <p class="scrub-note" id="scrub-note" hidden></p>
        <p class="source" id="source">Loading…</p>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
